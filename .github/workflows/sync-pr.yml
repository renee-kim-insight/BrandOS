# Runs in Insight-Global-Public/BrandOS only. When mirror.yml updates sync/main, open a pull request into
# main (or reuse the open one) and ask GitHub to merge it once the org's required checks pass.
name: Open the sync pull request

on:
  push:
    branches: [sync/main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  pr:
    if: github.repository == 'Insight-Global-Public/BrandOS'
    runs-on: ubuntu-latest
    steps:
      - name: Open or update the pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          pr=$(gh pr list -R "$REPO" --head sync/main --base main --state open --json number -q '.[0].number')
          if [ -z "$pr" ]; then
            gh pr create -R "$REPO" --base main --head sync/main \
              --title "Sync from renee-kim-insight/BrandOS" \
              --body "Latest changes from renee-kim-insight/BrandOS. Opened automatically; merges once the required checks pass."
            pr=$(gh pr list -R "$REPO" --head sync/main --base main --state open --json number -q '.[0].number')
          fi
          gh pr merge "$pr" -R "$REPO" --merge --auto || echo "::notice::Auto-merge isn't allowed here; merge pull request #$pr by hand."
