# Copies main and tags from renee-kim-insight/BrandOS to Insight-Global-Public/BrandOS.
# The internal repo protects main (no direct pushes, a security gate and code scanning must pass), so
# main is copied to the branch "sync/main" there; sync-pr.yml in that repo then opens a pull request
# into main, which runs the org's checks and merges itself once they pass (if auto-merge is allowed).
# Needs one secret on this repo, MIRROR_DEPLOY_KEY: the private half of an SSH key whose public half is a
# deploy key with write access on Insight-Global-Public/BrandOS. Without the secret it skips quietly.
name: Mirror to Insight-Global-Public

on:
  push:
    branches: [main]
    tags: ["**"]
  workflow_dispatch:

jobs:
  mirror:
    # Only run in the source repo, never in the copy.
    if: github.repository == 'renee-kim-insight/BrandOS'
    runs-on: ubuntu-latest
    steps:
      - name: Check for the deploy key
        id: key
        env:
          KEY: ${{ secrets.MIRROR_DEPLOY_KEY }}
        run: echo "present=$([ -n "$KEY" ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.key.outputs.present == 'yes'
        with:
          fetch-depth: 0

      - name: Push main to sync/main, and the tags
        if: steps.key.outputs.present == 'yes'
        env:
          KEY: ${{ secrets.MIRROR_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/mirror_key
          chmod 600 ~/.ssh/mirror_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/mirror_key -o IdentitiesOnly=yes"
          git remote add internal git@github.com:Insight-Global-Public/BrandOS.git
          git fetch --tags origin
          # sync/main is only ever a copy of this repo's main, so it is overwritten each time.
          git push --force internal "refs/remotes/origin/main:refs/heads/sync/main"
          git push internal --tags || echo "::warning::Some tags were not copied (the internal repo may protect tags). Create them there from the release page."
